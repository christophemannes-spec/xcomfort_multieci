name: "xComfort Multi-ECI"
version: "0.74.1"
slug: "xcomfort_multieci"
description: >-
  Eaton xComfort to MQTT gateway. Fork of karloygard/xcomfortd-go (v0.74)
  patching a datapoint-number collision that breaks most devices on every
  ECI except the last one loaded, in multi-ECI (multi-floor) setups. See
  README.md for the full explanation and a link to the original project.
startup: application
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
privileged:
  - SYS_RAWIO
usb: true
init: false
map:
  - config:rw
services:
  - mqtt:need
options:
  mqtt_client_id: xcomfort
  datapoints_file: ""
  datapoints_files: []
  eprom: false
  ha_discovery: true
  ha_discovery_prefix: homeassistant
  ha_discovery_remove: false
  verbose: false
  use_hidapi: false
  eci_hosts: []
schema:
  mqtt_client_id: str
  datapoints_file: str
  datapoints_files:
    - str
  eprom: bool
  ha_discovery: bool
  ha_discovery_prefix: str
  ha_discovery_remove: bool
  verbose: bool
  use_hidapi: bool
  eci_hosts:
    - str
